services:
  postgres:
    image: pgautoupgrade/pgautoupgrade:latest
    container_name: twitchtools-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: twitchtools
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d twitchtools"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: twitchtools-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/realm-twitch-tools.json:/opt/keycloak/data/import/realm-twitch-tools.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitchtools-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: PostgreSql
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=twitchtools;Username=postgres;Password=postgres
      Keycloak__Authority: http://localhost:8081/realms/twitch-tools
      Keycloak__MetadataAddress: http://keycloak:8080/realms/twitch-tools/.well-known/openid-configuration
      Keycloak__ClientId: twitch-tools-web
      Keycloak__ClientSecret: twitch-tools-secret
      Keycloak__RequireHttpsMetadata: "false"
      Twitch__DefaultClientId: ${TWITCH_CLIENT_ID:-}
      Twitch__OAuthClientSecret: ${TWITCH_CLIENT_SECRET:-}
      Twitch__EventSubSecret: ${TWITCH_EVENTSUB_SECRET:-replace-with-long-random-value}
      Twitch__OAuthRedirectUri: http://localhost:8080/my-tools/connect/twitch/callback
      Twitch__EventSubCallbackUrl: http://localhost:8080/my-tools/connect/twitch/eventsub/callback
      YouTube__DefaultClientId: ${YOUTUBE_CLIENT_ID:-}
      YouTube__OAuthClientSecret: ${YOUTUBE_CLIENT_SECRET:-}
      YouTube__OAuthRedirectUri: http://localhost:8080/my-tools/connect/youtube/callback
      Discord__BotClientId: ${DISCORD_BOT_CLIENT_ID:-}
      Encryption__Salt: ${ENCRYPTION_SALT:-replace-with-long-random-value}
      FeatureFlags__DisableExternalPosting: ${FEATURE_DISABLE_EXTERNAL_POSTING:-false}
      FeatureFlags__EnableEventSubIngressLogging: ${FEATURE_ENABLE_EVENTSUB_INGRESS_LOGGING:-false}
      FeatureFlags__EnableEventSubPayloadLogging: ${FEATURE_ENABLE_EVENTSUB_PAYLOAD_LOGGING:-false}
      FeatureFlags__EventSubPayloadRetentionDays: ${FEATURE_EVENTSUB_PAYLOAD_RETENTION_DAYS:-14}
      Site__SupportContactEmail: ${SITE_SUPPORT_CONTACT_EMAIL:-}
      # Standard OTel SDK environment variables - default to the local otel-collector service
      # below. Override OTEL_EXPORTER_OTLP_ENDPOINT to point at whatever OTel collector /
      # OpenSearch Data Prepper pipeline is already running in your environment instead.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: twitchtools-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres-data:

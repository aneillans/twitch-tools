# OpenTelemetry Collector — local dev (docker-compose.yml).
#
# Self-contained: telemetry is printed to the collector's own logs
# (`docker compose logs otel-collector`), so the local stack is observable with NO external
# OpenSearch / Data Prepper dependency. In production, point OTEL_EXPORTER_OTLP_ENDPOINT at
# whatever OTel collector / OpenSearch Data Prepper pipeline is already running in that
# environment instead of using this file.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  # Guardrail: keep the collector from ballooning if telemetry spikes. Must run first.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

exporters:
  debug: { verbosity: normal }

service:
  pipelines:
    traces:  { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
    logs:    { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
